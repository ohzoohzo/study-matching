<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 모집 · 스터디 매칭</title>
<script>
  try { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* 메뉴 오른쪽: 나 */
  .nav { position: sticky; }
  .me { position: relative; display: flex; align-items: center; gap: var(--spacing-8); margin-left: auto; }
  /* 알림함: 종 아이콘·안 읽은 개수 배지·알림 목록 */
  .note-btn { position: relative; padding: 0 var(--spacing-10); }
  .note-btn[hidden] { display: none; }
  .note-badge { position: absolute; top: calc(-1 * var(--spacing-6)); right: calc(-1 * var(--spacing-6)); min-width: 18px; height: 18px; padding: 0 var(--spacing-4); border-radius: var(--radius-full); background: var(--brand); color: var(--semantic-static-white); font-size: var(--typography-caption2-fontSize); line-height: 18px; font-weight: 700; text-align: center; }
  .note-badge[hidden] { display: none; }
  .me-panel.note-panel { max-height: min(70vh, 560px); overflow: auto; gap: var(--spacing-12); } /* 폭과 위치는 .me-panel과 같아요 */
  .note-head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8); }
  .note-head h2 { margin: 0; }
  .nav .note-panel .note-list { display: grid; gap: var(--spacing-4); width: 100%; margin: 0; padding: 0; list-style: none; overflow: visible; order: 0; }
  /* 알림 창은 메뉴(.nav) 안에 있어서, 메뉴 링크 스타일(.nav li a: 한 줄·높이 60px)을 덮어써요 */
  .nav .note-panel a.inbox-item { display: grid; gap: var(--spacing-2); height: auto; padding: var(--spacing-10) var(--spacing-12); border-radius: var(--radius-12); color: var(--fg-2); font-weight: 400; white-space: normal; box-shadow: none; text-decoration: none; }
  .nav .note-panel a.inbox-item:hover { background: var(--semantic-surface-neutral-tertiary); }
  .nav .note-panel a.inbox-item.unread { background: var(--brand-subtle); color: var(--fg); }
  .inbox-item b { color: var(--fg); }
  .inbox-item small { color: var(--fg-3); }
  .inbox-item .new { color: var(--brand-fg); font-weight: 600; }
  .note-empty { padding: var(--spacing-24) var(--spacing-16); }
  .me-btn { max-width: 220px; }
  .me-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-panel { position: absolute; right: var(--gutter); top: calc(100% + var(--spacing-8)); z-index: 15; width: min(380px, calc(100vw - 2 * var(--gutter))); max-height: calc(100dvh - 88px); overflow-y: auto; overscroll-behavior: contain; display: grid; gap: var(--spacing-16); box-shadow: var(--semantic-elevation-shadow-normal-large); }
  .me-panel[hidden] { display: none; }
  /* 메뉴(sticky)에 붙은 창이라 화면보다 길면 아래가 닿지 않아요: 화면 높이에 맞추고 창 안에서 스크롤해요 */
  .me-panel { max-height: calc(100vh - 128px); max-height: calc(100dvh - 128px); overflow-y: auto; overscroll-behavior: contain; }
  .me-panel h2 { margin: 0; }
  .me-panel select, .select { width: 100%; height: 48px; padding: 0 var(--spacing-12); border: 1px solid var(--line); border-radius: var(--radius-12); background: var(--bg); }
  .me-now { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-6); color: var(--fg-2); }
  .divider { border: 0; border-top: 1px solid var(--line-soft); margin: 0; }
  .push-box { display: grid; gap: var(--spacing-6); }
  .push-box .note { margin: 0; }

  /* 머리 */
  .head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--spacing-16); }
  .head-row > div { min-width: 0; }

  /* 활기 숫자 칸: 값은 크게(비례 숫자), 이름표·설명은 글자색 토큰 */
  .stats { margin: 0 0 var(--spacing-24); }
  .stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--spacing-12); margin: 0; padding: 0; list-style: none; }
  .stat { display: grid; align-content: start; gap: var(--spacing-4); min-width: 0; padding: var(--spacing-16); border: 1px solid var(--line-soft); border-radius: var(--radius-16); background: var(--card); }
  .stat-label { color: var(--fg-2); font-weight: 600; }
  .stat-value { color: var(--fg-2); }
  .stat-value b { margin-right: var(--spacing-2); color: var(--fg); font-size: var(--typography-title2-fontSize); line-height: var(--typography-title2-lineHeight); font-weight: 700; }
  .stat-sub { color: var(--fg-3); }
  /* 필터 */
  .filters { display: grid; gap: var(--spacing-12); margin-bottom: var(--spacing-20); }
  .filters .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-8); }
  .filters .row > .label { min-width: 64px; color: var(--fg-3); font-weight: 600; }
  .chip .mi { width: 16px; height: 16px; }
  .search { flex: 1 1 280px; max-width: 440px; }
  .search input::-webkit-search-cancel-button { cursor: pointer; }
  .chip[disabled] { opacity: .45; cursor: default; }
  .count { color: var(--fg-3); margin: 0 0 var(--spacing-12); }
  .count-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-8); margin: 0 0 var(--spacing-12); }
  .count-row .count { margin: 0; }
  .btn[aria-busy="true"] { cursor: progress; }

  /* 스터디 카드 */
  .studies { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-16); margin: 0; padding: 0; list-style: none; }
  .studies > li { min-width: 0; }
  .study { display: flex !important; flex-direction: column; gap: var(--spacing-10); height: 100%; position: relative; transition: box-shadow .2s, border-color .2s, transform .2s; }
  /* 카드 전체가 상세로 가는 링크예요: 제목 링크의 ::after가 카드를 덮고, 해시태그 버튼만 그 위에 올라와요 */
  .study:hover { border-color: var(--line); box-shadow: var(--semantic-elevation-shadow-normal-medium); transform: translateY(-2px); }
  .study:has(.study-link:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }
  .study-link { color: inherit; text-decoration: none; }
  .study-link:focus-visible { outline: none; }
  .study-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .study-tags { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-4); }
  .detail-tags { margin-top: var(--spacing-8); }
  .tag-btn { position: relative; z-index: 1; min-height: 28px; border: 0; cursor: pointer; overflow-wrap: anywhere; text-align: left; }
  .tag-btn:hover { background: var(--semantic-surface-neutral-tertiary); }
  .tag-btn[aria-pressed="true"] { background: var(--brand-subtle); color: var(--brand-fg); font-weight: 600; }
  .tag-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  /* 손가락으로 누르는 기기에서는 태그 버튼을 칩(36px)만큼 키워서, 잘못 눌러 상세로 넘어가지 않게 해요 */
  @media (pointer: coarse) { .tag-btn { min-height: 36px; padding: 0 var(--spacing-10); } .study-tags { gap: var(--spacing-6); } }
  .study .tags { display: flex; flex-wrap: wrap; gap: var(--spacing-6); }
  .study h3 { margin: 0; }
  .study .goal { margin: 0; color: var(--fg-2); }
  .meta { color: var(--fg-3); }
  .leader { color: var(--fg-2); }
  .seats { display: grid; gap: var(--spacing-4); margin-top: auto; }
  .seats .line { display: flex; justify-content: space-between; color: var(--fg-2); }
  .bar { display: block; height: 6px; border-radius: var(--radius-full); background: var(--semantic-surface-neutral-secondary); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
  .bar.full i { background: var(--fg-3); }
  .mix { display: flex; flex-wrap: wrap; gap: var(--spacing-4); margin: 0; padding: 0; list-style: none; }
  .mix .tag.zero { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-3); }
  .missing { margin: 0; color: var(--brand-fg); font-weight: 600; }
  .overlap { display: grid; gap: var(--spacing-6); margin: var(--spacing-4) 0 var(--spacing-12); padding: var(--spacing-12); border-radius: var(--radius-12); background: var(--bg-2); }
  .overlap .note { margin: 0; }
  .dates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--spacing-12); }
  .dates .field > label { margin-bottom: var(--spacing-6); color: var(--fg-2); }
  .dates .text { min-width: 0; }
  .missing.done { color: var(--fg-3); font-weight: 400; }
  .status-open { background: var(--semantic-surface-positive-primary); color: var(--semantic-foreground-positive-primary); font-weight: 600; }
  .status-pending { background: var(--semantic-surface-cautionary-primary); color: var(--semantic-foreground-cautionary-primary); }
  .status-accepted { background: var(--semantic-surface-positive-primary); color: var(--semantic-foreground-positive-primary); }
  .status-rejected, .status-withdrawn, .status-left, .status-removed { background: var(--semantic-surface-neutral-secondary); color: var(--fg-3); }

  /* 폼 */
  .form { display: grid; gap: var(--spacing-24); max-width: 640px; }
  .form.compact { gap: var(--spacing-16); }
  .field > label, .field > .label { display: block; margin-bottom: var(--spacing-8); font-weight: 600; }
  .field .hint { margin: var(--spacing-4) 0 0; color: var(--fg-3); }
  .field .err { margin: var(--spacing-6) 0 0; color: var(--semantic-foreground-negative-primary); }
  .text { width: 100%; height: 48px; padding: 0 var(--spacing-14); border: 1px solid var(--line); border-radius: var(--radius-12); background: var(--bg); }
  .text:focus, .select:focus, .me-panel select:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--semantic-line-brand-focus); }
  .text[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--semantic-line-negative-primary, var(--semantic-foreground-negative-primary)); }
  .half { max-width: 240px; }
  /* 해시태그 입력칸: 칩 + 입력칸이 한 상자 안에서 줄을 바꿔요 */
  .tag-input { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-6); min-height: 48px; padding: var(--spacing-6) var(--spacing-10); border: 1px solid var(--line); border-radius: var(--radius-12); background: var(--bg); }
  .tag-input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--semantic-line-brand-focus); }
  .tag-input:has([aria-invalid="true"]) { border-color: var(--semantic-line-negative-primary, var(--semantic-foreground-negative-primary)); }
  .tag-chips { display: contents; }
  .tag-chip { gap: var(--spacing-2); max-width: 100%; padding-right: var(--spacing-2); overflow-wrap: anywhere; }
  .tag-del { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--radius-full); background: none; color: inherit; cursor: pointer; }
  .tag-del:hover { background: var(--semantic-surface-neutral-tertiary); }
  .tag-del:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .tag-del .mi { width: 16px; height: 16px; }
  .tag-text { flex: 1 1 140px; min-width: 0; height: 34px; padding: 0 var(--spacing-4); border: 0; outline: 0; background: none; }
  .tag-text:focus-visible { outline: 0; } /* 포커스는 바깥 상자(.tag-input:focus-within)가 보여 줘요 */
  .tag-suggest { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-6); margin-top: var(--spacing-8); }
  .tag-suggest:empty { display: none; }
  .chip-sm { height: auto; min-height: 32px; padding: var(--spacing-4) var(--spacing-10); }
  /* 태그 칩은 글자가 넓어도(예: 영문 대문자 20자) 줄을 바꿔서 375px 창을 옆으로 밀지 않아요 */
  .chip-sm, .chip[data-tagq] { max-width: 100%; white-space: normal; overflow-wrap: anywhere; text-align: left; }
  .chip[data-tagq] { height: auto; min-height: 36px; }
  .me-panel > * { min-width: 0; }
  .chip-sm .mi { width: 16px; height: 16px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-8); }

  /* 상세 */
  .two { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--spacing-24); align-items: start; }
  .stack { display: grid; gap: var(--spacing-16); }
  .card h2 { margin: 0 0 var(--spacing-8); }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-8); padding: var(--spacing-12) 0; border-bottom: 1px solid var(--line-soft); }
  .rows li:last-child { border-bottom: 0; }
  .rows.card { padding: 0 var(--spacing-20); } /* 내 스터디 카드 목록: .rows의 padding 0이 카드 좌우 여백을 지우지 않게 해요 */
  .rows .who { display: flex; flex-direction: column; min-width: 0; }
  .rows .who small { color: var(--fg-3); }
  .rows .who a { text-decoration: none; font-weight: 600; }
  .rows .who a:hover { text-decoration: underline; }
  .goal-box { margin-top: var(--spacing-16); padding: var(--spacing-12) var(--spacing-16); border-radius: var(--radius-12); background: var(--bg-2); color: var(--fg-2); }
  .goal-box b { color: var(--fg); }
  .note { margin: 0; color: var(--fg-3); }
  .next { border-color: var(--brand); background: var(--brand-subtle); }
  .next ol { margin: 0; padding-left: var(--spacing-20); display: grid; gap: var(--spacing-8); color: var(--fg); }
  .next a { color: var(--brand-fg); font-weight: 600; }
  /* 되돌릴 수 없는 동작: 모집 취소·신청 취소 */
  .btn-danger { border: 1px solid var(--semantic-line-negative-strong); background: var(--semantic-surface-negative-primary); color: var(--semantic-foreground-negative-strong); }
  .btn-danger:hover { background: var(--semantic-surface-negative-strong); }
  .danger-zone { display: grid; gap: var(--spacing-12); margin-top: var(--spacing-20); }
  .danger-zone p { margin: var(--spacing-4) 0 0; }
  .danger-zone .btn { justify-self: start; }
  /* 취소된 스터디 안내 */
  .notice { display: flex; align-items: flex-start; gap: var(--spacing-10); margin-top: var(--spacing-16); padding: var(--spacing-16); border: 1px solid var(--line); border-radius: var(--radius-12); background: var(--bg-2); color: var(--fg-2); }
  .notice .mi { margin-top: 2px; color: var(--fg-3); }
  .notice b { color: var(--fg); }
  .notice p { margin: var(--spacing-4) 0 var(--spacing-12); }
  /* 확인 창 */
  .dlg { width: min(440px, calc(100vw - 2 * var(--spacing-16))); max-width: none; padding: 0; border: 0; border-radius: var(--radius-20); background: var(--card); color: var(--fg); box-shadow: var(--semantic-elevation-shadow-normal-large); }
  .dlg::backdrop { background: var(--semantic-effect-dimmer-primary); }
  .dlg .in { display: grid; gap: var(--spacing-8); padding: var(--spacing-24); }
  .dlg h2 { margin: 0; }
  .dlg p { margin: 0; color: var(--fg-2); }
  .dlg .actions { justify-content: flex-end; margin-top: var(--spacing-16); }
  .toast { position: fixed; left: 50%; bottom: var(--spacing-24); translate: -50% 0; z-index: 20; max-width: calc(100vw - 2 * var(--spacing-16)); padding: var(--spacing-12) var(--spacing-16); border-radius: var(--radius-12); background: var(--semantic-surface-neutral-inverse); color: var(--semantic-foreground-neutral-inverse); box-shadow: var(--semantic-elevation-shadow-normal-large); }
  .foot a { color: var(--fg-2); }
  [tabindex="-1"]:focus { outline: none; }

  @media (max-width: 900px) { .studies { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    .studies { grid-template-columns: 1fr; }
    .nav .wrap { flex-wrap: wrap; height: auto; padding-top: var(--spacing-8); row-gap: 0; }
    .nav ul { margin-left: 0; order: 3; width: 100%; }
    .nav li a { height: 44px; }
    .me { margin-left: auto; position: static; }
    .me-btn { max-width: 180px; }
    .filters .row > .label { width: 100%; }
    .dates { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i, .study { transition: none; } .study:hover { transform: none; } }
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>

<nav class="nav" aria-label="주 메뉴">
  <div class="wrap">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--brand)" d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3 1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
      <b>스터디 모집</b>
    </a>
    <ul>
      <li><a href="#/" data-route="list">스터디 목록</a></li>
      <li><a href="#/new" data-route="new">스터디 열기</a></li>
      <li><a href="#/my" data-route="my">내 스터디</a></li>
    </ul>
    <div class="me">
      <button type="button" id="noteBtn" class="btn btn-outline btn-sm note-btn" aria-expanded="false" aria-controls="notePanel" aria-label="알림" hidden>
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span id="noteBadge" class="note-badge" aria-hidden="true" hidden></span>
      </button>
      <button type="button" id="meBtn" class="btn btn-outline btn-sm me-btn" aria-expanded="false" aria-controls="mePanel">
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="meLabel">로그인</span>
      </button>
    </div>
  </div>
  <div id="mePanel" class="card me-panel" role="region" aria-label="나" hidden></div>
  <div id="notePanel" class="card me-panel note-panel" role="region" aria-label="알림" hidden></div>
</nav>

<main class="wrap" id="app" tabindex="-1" aria-busy="true">
  <div class="sec" role="status"><span class="sr">스터디 목록을 불러오고 있어요.</span><div class="skeleton" style="height: 240px" aria-hidden="true"></div></div>
</main>

<footer class="foot t-caption1">
  <div class="wrap">
    <span><b>스터디 모집</b> · 원티드 디자인 시스템 Montage(MIT)의 디자인 토큰을 사용했어요.</span>
    <span>원티드와 관련 없는 실습 사이트예요. 스터디·신청·프로필은 서버(Vercel Storage)에 저장돼서 모두가 같은 목록을 봐요. <a href="/v1/">기획안 버전(매칭보드, 백업) 보기</a> · <a href="/privacy.html">개인정보처리방침</a></span>
  </div>
</footer>

<div id="toast" class="toast t-label1" role="status" aria-live="polite" hidden></div>

<dialog id="confirmDlg" class="dlg" aria-labelledby="dlgTitle" aria-describedby="dlgBody">
  <div class="in">
    <h2 id="dlgTitle" class="t-headline1"></h2>
    <p id="dlgBody" class="t-body2"></p>
    <div class="actions"><button type="button" class="btn btn-outline btn-sm" data-dlg="back">돌아가기</button><button type="button" class="btn btn-sm btn-primary" data-dlg="ok">확인</button></div>
  </div>
</dialog>

<script type="module" src="/recruit/recruit.js"></script>
</body>
</html>
