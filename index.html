<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 매칭보드</title>
<script>
  try { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<link rel="stylesheet" href="/style.css">
<style>
  .me { display: flex; align-items: center; gap: var(--spacing-8); margin-left: var(--spacing-8); }
  .me select { height: 36px; padding: 0 var(--spacing-10); border: 1px solid var(--line); border-radius: var(--radius-10); background: var(--bg); max-width: 180px; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-12); margin-top: var(--spacing-16); padding: var(--spacing-12) var(--spacing-16); border-radius: var(--radius-12); background: var(--brand-subtle); color: var(--brand-fg); }
  .banner.done { background: var(--semantic-surface-positive-primary); color: var(--semantic-foreground-positive-primary); }

  /* 추천 */
  .recs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-12); margin: 0; padding: 0; list-style: none; }
  .rec { display: flex; flex-direction: column; gap: var(--spacing-6); }
  .rec .head { display: flex; justify-content: space-between; align-items: center; }
  .rec .pts { font-weight: 700; color: var(--brand-fg); }
  .rec ul { margin: 0; padding-left: var(--spacing-16); color: var(--fg-2); }

  /* 팀 카드 */
  .domain-group { margin-bottom: var(--spacing-32); }
  .domain-group h3 { margin: 0 0 var(--spacing-12); }
  .teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-16); margin: 0; padding: 0; list-style: none; }
  .team { display: flex; flex-direction: column; gap: var(--spacing-10); height: 100%; }
  .team .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--spacing-8); }
  .team .times { color: var(--fg-3); }
  .slots { display: grid; gap: var(--spacing-6); margin: 0; padding: 0; list-style: none; }
  .slots li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: var(--spacing-8); }
  .pips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pip { width: 22px; height: 22px; border-radius: var(--radius-full); border: 1.5px solid var(--brand); }
  .pip.full { background: var(--brand); }
  .pip.opt { width: auto; padding: 0 var(--spacing-8); border-style: dashed; border-color: var(--line); color: var(--fg-3); font-size: var(--typography-caption1-fontSize); line-height: 19px; }
  .need { color: var(--brand-fg); font-weight: 600; }
  .need.zero { color: var(--fg-3); font-weight: 400; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--spacing-12); color: var(--fg-3); margin-bottom: var(--spacing-16); }
  .legend span { display: inline-flex; align-items: center; gap: var(--spacing-4); }
  .legend .pip { width: 14px; height: 14px; }
  .legend .pip.opt { width: auto; height: 16px; line-height: 13px; }

  /* 폼 */
  .form { display: grid; gap: var(--spacing-24); max-width: 640px; }
  .field > label, .field > .label { display: block; margin-bottom: var(--spacing-8); font-weight: 600; }
  .field .hint { margin: var(--spacing-4) 0 0; color: var(--fg-3); }
  .field .err { margin: var(--spacing-6) 0 0; color: var(--semantic-foreground-negative-primary); }
  .text { width: 100%; height: 48px; padding: 0 var(--spacing-14); border: 1px solid var(--line); border-radius: var(--radius-12); background: var(--bg); }
  .text:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--semantic-line-brand-focus); }
  .chip .rank { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--bg); color: var(--fg); font-size: 11px; font-weight: 700; }

  /* 상세·관리 */
  .two { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--spacing-24); align-items: start; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-8); padding: var(--spacing-12) 0; border-bottom: 1px solid var(--line-soft); }
  .rows li:last-child { border-bottom: 0; }
  .rows .who { display: flex; flex-direction: column; }
  .rows .who small { color: var(--fg-3); }
  .actions { display: flex; flex-wrap: wrap; gap: var(--spacing-6); }
  .status-pending { background: var(--semantic-surface-cautionary-primary); color: var(--semantic-foreground-cautionary-primary); }
  .status-accepted { background: var(--semantic-surface-positive-primary); color: var(--semantic-foreground-positive-primary); }
  .status-rejected { background: var(--semantic-surface-neutral-secondary); color: var(--fg-3); }
  .table-wrap { overflow-x: auto; }
  table.slot-table { width: 100%; border-collapse: collapse; }
  .slot-table th, .slot-table td { padding: var(--spacing-8) var(--spacing-10); border-bottom: 1px solid var(--line-soft); text-align: center; white-space: nowrap; }
  .slot-table th:first-child, .slot-table td:first-child { text-align: left; }
  .slot-table thead th { color: var(--fg-3); font-weight: 500; }
  .opt-cell { color: var(--fg-3); }
  .count-row { display: flex; flex-wrap: wrap; align-items: end; gap: var(--spacing-8); }
  .count-row .text { width: 120px; }
  .toast { position: fixed; left: 50%; bottom: var(--spacing-24); translate: -50% 0; z-index: 20; padding: var(--spacing-12) var(--spacing-16); border-radius: var(--radius-12); background: var(--semantic-surface-neutral-inverse); color: var(--semantic-foreground-neutral-inverse); box-shadow: var(--semantic-elevation-shadow-normal-large); }

  @media (max-width: 900px) { .recs, .teams { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {
    .recs, .teams { grid-template-columns: 1fr; }
    .nav .wrap { flex-wrap: wrap; height: auto; padding-top: var(--spacing-8); }
    .nav ul { margin-left: 0; order: 3; width: 100%; }
    .nav li a { height: 44px; }
    .me { margin-left: auto; }
    .me select { max-width: 140px; }
  }
</style>
</head>
<body>

<nav class="nav" aria-label="주 메뉴">
  <div class="wrap">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--brand)" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <b>스터디 매칭보드</b>
    </a>
    <ul>
      <li><a href="#/" data-route="board">매칭보드</a></li>
      <li><a href="#/profile" data-route="profile">프로필 등록</a></li>
      <li><a href="#/admin" data-route="admin">운영진 관리</a></li>
    </ul>
    <label class="me t-label1"><span class="sr">지금 보는 사람</span>
      <select id="me" aria-label="지금 보는 사람"></select>
    </label>
  </div>
</nav>

<main class="wrap" id="app" tabindex="-1">
  <div class="skeleton" style="height: 240px; margin-top: var(--spacing-40)"></div>
</main>

<footer class="foot t-caption1">
  <div class="wrap">
    <span><b>스터디 매칭보드</b> · 원티드 디자인 시스템 Montage(MIT)의 디자인 토큰을 사용했어요.</span>
    <span>원티드와 관련 없는 실습 사이트예요. 이름은 테스트용 가명이에요. 데이터는 이 브라우저에만 저장돼요. <a href="/recruit/">공지용 스터디 모집 버전 보기</a> · <a href="/privacy.html">개인정보처리방침</a></span>
  </div>
</footer>

<div id="toast" class="toast t-label1" role="status" aria-live="polite" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
