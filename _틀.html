<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지 이름 · 스터디 매칭</title>
<script>
  // 시스템이 다크 모드면 Montage 다크 토큰을 써요
  try { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<link rel="stylesheet" href="/style.css">
<style>
  /* 내 페이지 전용 스타일만 여기에. 색·간격은 Montage 변수만 써요. */
</style>
</head>
<body>

<!-- 메뉴: 그대로 복사하고, 내 페이지 링크에만 aria-current="page"를 넣어요 -->
<nav class="nav" aria-label="주 메뉴">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--brand)" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <b>스터디 매칭</b>
    </a>
    <ul>
      <li><a href="/">홈</a></li>
      <li><a href="/studies/">스터디 찾기</a></li>
      <li><a href="/create/">스터디 만들기</a></li>
      <li><a href="/my/">내 스터디</a></li>
    </ul>
  </div>
</nav>

<main class="wrap">
  <header class="page-head">
    <h1 class="t-title1">페이지 제목</h1>
    <p>이 페이지에서 할 수 있는 일을 한 문장으로 적어요.</p>
  </header>

  <!-- 데이터를 쓰는 화면은 세 가지 상태를 모두 만들어요: 불러오는 중 · 오류 · 빈 상태 -->
  <section aria-live="polite" id="content">
    <div class="skeleton" style="height: 120px"></div>
  </section>
</main>

<footer class="foot t-caption1">
  <div class="wrap">
    <span><b>스터디 매칭</b> · 원티드 디자인 시스템 Montage(MIT)의 디자인 토큰을 사용했어요.</span>
    <span>원티드와 관련 없는 실습 사이트예요. 보이는 스터디와 닉네임은 가상 데이터예요.</span>
  </div>
</footer>

<script>
  // 데이터는 /api/에서 받아요. 실패하면 오류 상태를 보여 줘요.
  async function load() {
    const box = document.getElementById('content');
    try {
      const res = await fetch('/api/studies');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '불러오지 못했어요.');
      box.textContent = '스터디 ' + data.count + '개를 불러왔어요.';
    } catch (err) {
      box.innerHTML = '<div class="alert" role="alert"></div>';
      box.firstChild.textContent = err.message + ' 잠시 뒤에 다시 시도해 주세요.';
    }
  }
  load();
</script>
</body>
</html>
